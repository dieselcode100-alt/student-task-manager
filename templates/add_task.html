<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task - Student Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="nav-brand">📚 Student Task Manager</div>
    <div class="nav-right">
        <a href="/dashboard" class="btn btn-logout">← Back to Dashboard</a>
    </div>
</nav>

<div class="main-container">
    <div class="form-container">
        <h2>Add New Task</h2>

        <form method="POST">
            <div class="form-group">
                <label for="title">Task Title</label>
                <input type="text" id="title" name="title" placeholder="e.g. Submit Math Assignment" required>
            </div>

            <div class="form-group">
                <label for="description">Description (optional)</label>
                <textarea id="description" name="description" placeholder="Add more details about this task..." rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date">
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">Save Task</button>
                <a href="/dashboard" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
