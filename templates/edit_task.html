<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - Student Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="nav-brand">📚 Student Task Manager</div>
    <div class="nav-right">
        <a href="/dashboard" class="btn btn-logout">← Back to Dashboard</a>
    </div>
</nav>

<div class="main-container">
    <div class="form-container">
        <h2>Edit Task</h2>

        <form method="POST">
            <div class="form-group">
                <label for="title">Task Title</label>
                <input type="text" id="title" name="title" value="{{ task['title'] }}" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4">{{ task['description'] }}</textarea>
            </div>

            <div class="form-group">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date" value="{{ task['due_date'] }}">
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Pending" {% if task['status'] == 'Pending' %}selected{% endif %}>Pending</option>
                    <option value="Completed" {% if task['status'] == 'Completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">Update Task</button>
                <a href="/dashboard" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
